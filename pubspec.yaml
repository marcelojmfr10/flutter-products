name: flutter_products
description: "A new Flutter project."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  dio: ^5.11.1
  flutter:
    sdk: flutter
  flutter_dotenv: ^6.0.1
  flutter_riverpod: ^3.4.3
  flutter_staggered_grid_view: ^0.6.2
  formz: ^0.8.1
  go_router: ^18.1.2
  google_fonts: ^9.0.0
  image_picker: ^1.2.4
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - assets/loaders/
    - assets/images/
    - google_fonts/montserrat_alternates/
    - .env
